<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StepiFi</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }
        .container { width: 100%; max-width: 360px; }
        .card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 15px;
        }
        h1 { color: #38bdf8; margin: 0 0 15px 0; }
        .stat-box {
            background: #334155;
            padding: 12px;
            margin: 8px 0;
            border-radius: 12px;
        }
        .number { font-size: 28px; font-weight: bold; color: #4ade80; }
        .points { color: #facc15; }
        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
        }
        .leaderboard {
            background-color: #0f172a;
            border-radius: 12px;
            padding: 12px;
            text-align: right;
        }
        .leaderboard h3 { color: #facc15; text-align: center; margin: 0 0 10px 0; }
        .player-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #334155;
            font-size: 14px;
        }
        .my-score { color: #38bdf8; font-weight: bold; }
        .badges-card {
            background-color: #1e293b;
            padding: 15px;
            border-radius: 20px;
        }
        .badges-card h3 { text-align: center; margin: 0 0 10px 0; }
        .badges-grid { display: flex; justify-content: space-around; }
        .badge-item {
            background: #334155;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            opacity: 0.3;
            width: 70px;
        }
        .badge-icon { font-size: 24px; }
        .badge-name { font-size: 10px; margin-top: 4px; }
        .badge-unlocked { opacity: 1; border: 2px solid #4ade80; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>🏃‍♂️ StepiFi</h1>
        <div class="stat-box">
            <div>خطوات اليوم:</div>
            <div class="number" id="steps">0</div>
        </div>
        <div class="stat-box">
            <div>مجموع النقاط:</div>
            <div class="number points" id="points">0 🪙</div>
        </div>
        <button onclick="addSteps()">محاكاة مشي (+1000 خطوة)</button>
        <div class="leaderboard">
            <h3>🏆 المتصدرون أسبوعياً</h3>
            <div class="player-row"><span>🥇 أمين</span><span>250 🪙</span></div>
            <div class="player-row"><span>🥈 سارة</span><span>180 🪙</span></div>
            <div class="player-row my-score"><span>🥉 أنت (حسابك)</span><span id="user-lb">0 🪙</span></div>
            <div class="player-row"><span>4. كريم</span><span>100 🪙</span></div>
        </div>
    </div>

    <div class="badges-card">
        <h3>🏅 أوسمة الإنجاز</h3>
        <div class="badges-grid">
            <div class="badge-item" id="badge-1">
                <div class="badge-icon">👣</div>
                <div class="badge-name">الخطوة الأولى</div>
            </div>
            <div class="badge-item" id="badge-2">
                <div class="badge-icon">🎯</div>
                <div class="badge-name">الهدف اليومي</div>
            </div>
            <div class="badge-item badge-unlocked">
                <div class="badge-icon">🔥</div>
                <div class="badge-name">المثابر</div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentSteps = 0;
    function addSteps() {
        currentSteps += 1000;
        let points = Math.floor(currentSteps / 100);
        if (currentSteps >= 8000) { points += 50; }

        document.getElementById('steps').innerText = currentSteps.toLocaleString();
        document.getElementById('points').innerText = points.toLocaleString() + " 🪙";
        document.getElementById('user-lb').innerText = points.toLocaleString() + " 🪙";

        if (currentSteps >= 1000) { document.getElementById('badge-1').classList.add('badge-unlocked'); }
        if (currentSteps >= 8000) { document.getElementById('badge-2').classList.add('badge-unlocked'); }
    }
</script>

</body>
</html>
