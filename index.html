<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StepiFi</title>
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --stat-bg: #334155;
            --text-color: #ffffff;
            --subtext-color: #94a3b8;
            --border-color: #334155;
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --stat-bg: #e2e8f0;
            --text-color: #0f172a;
            --subtext-color: #64748b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            user-select: none;
            transition: background-color 0.3s, color 0.3s;
        }
        .container { width: 100%; max-width: 360px; }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .top-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }
        h1 { color: #38bdf8; margin: 0 0 15px 0; font-size: 26px; }
        .stat-box {
            background: var(--stat-bg);
            padding: 12px;
            margin: 8px 0;
            border-radius: 12px;
            transition: background-color 0.3s;
        }
        .number { font-size: 28px; font-weight: bold; color: #22c55e; }
        .points { color: #eab308; }
        button.action-btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin: 8px 0;
            transition: transform 0.1s;
        }
        button.action-btn:active { transform: scale(0.98); }
        .sensor-btn { background-color: #a855f7; color: #fff; }
        .reset-btn {
            background-color: transparent;
            color: var(--subtext-color);
            font-size: 12px;
            text-decoration: underline;
            margin-top: 2px;
            border: none;
            cursor: pointer;
        }
        .leaderboard {
            background-color: var(--bg-color);
            border-radius: 12px;
            padding: 12px;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        .leaderboard h3 { color: #eab308; text-align: center; margin: 0 0 10px 0; font-size: 16px; }
        .player-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }
        .my-score { color: #38bdf8; font-weight: bold; }
        .badges-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }
        .badges-card h3 { text-align: center; margin: 0 0 10px 0; font-size: 16px; }
        .badges-grid { display: flex; justify-content: space-around; }
        .badge-item {
            background: var(--stat-bg);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            opacity: 0.3;
            width: 70px;
            transition: all 0.3s;
        }
        .badge-icon { font-size: 24px; }
        .badge-name { font-size: 10px; margin-top: 4px; }
        .badge-unlocked { opacity: 1; border: 2px solid #22c55e; box-shadow: 0 0 10px rgba(34, 197, 94, 0.4); }
    </style>
</head>
<body>

<div class="container">
    <!-- شريط التحكم العلوي -->
    <div class="top-bar">
        <button class="top-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
        <select class="top-btn" id="langSelect" onchange="changeLanguage(this.value)">
            <option value="ar">العربية 🇸🇦</option>
            <option value="fr">Français 🇫🇷</option>
            <option value="en">English 🇬🇧</option>
        </select>
    </div>

    <div class="card">
        <h1>🏃‍♂️ StepiFi</h1>
        <div class="stat-box">
            <div id="t-steps-label">خطوات اليوم:</div>
            <div class="number" id="steps">0</div>
        </div>
        <div class="stat-box">
            <div id="t-points-label">مجموع النقاط:</div>
            <div class="number points" id="points">0 🪙</div>
        </div>

        <button class="action-btn sensor-btn" id="sensorBtn" onclick="toggleSensor()">تفعيل عداد حركة الهاتف 📱</button>
        <button class="action-btn" id="t-sim-btn" onclick="addSteps(1000)">محاكاة (+1000 خطوة)</button>
        <br>
        <button class="reset-btn" id="t-reset-btn" onclick="resetData()">إعادة ضبط العداد</button>

        <div class="leaderboard">
            <h3 id="t-lb-title">🏆 المتصدرون أسبوعياً</h3>
            <div class="player-row"><span>🥇 Amine</span><span>250 🪙</span></div>
            <div class="player-row"><span>🥈 Sarah</span><span>180 🪙</span></div>
            <div class="player-row my-score"><span id="t-user-row">🥉 أنت (حسابك)</span><span id="user-lb">0 🪙</span></div>
            <div class="player-row"><span>4. Karim</span><span>100 🪙</span></div>
        </div>
    </div>

    <div class="badges-card">
        <h3 id="t-badges-title">🏅 أوسمة الإنجاز</h3>
        <div class="badges-grid">
            <div class="badge-item" id="badge-1">
                <div class="badge-icon">👣</div>
                <div class="badge-name" id="t-badge1">الخطوة الأولى</div>
            </div>
            <div class="badge-item" id="badge-2">
                <div class="badge-icon">🎯</div>
                <div class="badge-name" id="t-badge2">الهدف اليومي</div>
            </div>
            <div class="badge-item badge-unlocked">
                <div class="badge-icon">🔥</div>
                <div class="badge-name" id="t-badge3">المثابر</div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentSteps = parseInt(localStorage.getItem('stepifi_steps')) || 0;
    let currentLang = localStorage.getItem('stepifi_lang') || 'ar';
    let isDarkMode = localStorage.getItem('stepifi_theme') !== 'light';
    let isSensoring = false;
    let lastAccel = 0;

    const translations = {
        ar: {
            stepsLabel: "خطوات اليوم:",
            pointsLabel: "مجموع النقاط:",
            sensorStart: "تفعيل عداد حركة الهاتف 📱",
            sensorStop: "العداد يعمل الآن... (إيقاف) 🛑",
            simBtn: "محاكاة (+1000 خطوة)",
            resetBtn: "إعادة ضبط العداد",
            lbTitle: "🏆 المتصدرون أسبوعياً",
            userRow: "🥉 أنت (حسابك)",
            badgesTitle: "🏅 أوسمة الإنجاز",
            badge1: "الخطوة الأولى",
            badge2: "الهدف اليومي",
            badge3: "المثابر",
            confirmReset: "هل تريد إعادة ضبط الخطوات والنقاط للصفر؟"
        },
        fr: {
            stepsLabel: "Pas d'aujourd'hui:",
            pointsLabel: "Total des Points:",
            sensorStart: "Activer le Capteur 📱",
            sensorStop: "Capteur Actif... (Arrêter) 🛑",
            simBtn: "Simulation (+1000 Pas)",
            resetBtn: "Réinitialiser",
            lbTitle: "🏆 Classement Hebdo",
            userRow: "🥉 Vous (Votre Compte)",
            badgesTitle: "🏅 Badges d'Étape",
            badge1: "Premier Pas",
            badge2: "Objectif Jour",
            badge3: "Persévérant",
            confirmReset: "Voulez-vous réinitialiser vos pas et points ?"
        },
        en: {
            stepsLabel: "Today's Steps:",
            pointsLabel: "Total Points:",
            sensorStart: "Enable Motion Sensor 📱",
            sensorStop: "Sensor Active... (Stop) 🛑",
            simBtn: "Simulate (+1000 Steps)",
            resetBtn: "Reset Counter",
            lbTitle: "🏆 Weekly Leaderboard",
            userRow: "🥉 You (Your Account)",
            badgesTitle: "🏅 Achievement Badges",
            badge1: "First Step",
            badge2: "Daily Goal",
            badge3: "Persistent",
            confirmReset: "Do you want to reset your steps and points?"
        }
    };

    function applyTheme() {
        if (isDarkMode) {
            document.body.classList.remove('light-mode');
            document.getElementById('themeBtn').innerText = "🌙 Dark";
        } else {
            document.body.classList.add('light-mode');
            document.getElementById('themeBtn').innerText = "☀️ Light";
        }
    }

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        localStorage.setItem('stepifi_theme', isDarkMode ? 'dark' : 'light');
        applyTheme();
    }

    function changeLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('stepifi_lang', lang);
        document.documentElement.lang = lang;
        document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
        
        const t = translations[lang];
        document.getElementById('t-steps-label').innerText = t.stepsLabel;
        document.getElementById('t-points-label').innerText = t.pointsLabel;
        document.getElementById('t-sim-btn').innerText = t.simBtn;
        document.getElementById('t-reset-btn').innerText = t.resetBtn;
        document.getElementById('t-lb-title').innerText = t.lbTitle;
        document.getElementById('t-user-row').innerText = t.userRow;
        document.getElementById('t-badges-title').innerText = t.badgesTitle;
        document.getElementById('t-badge1').innerText = t.badge1;
        document.getElementById('t-badge2').innerText = t.badge2;
        document.getElementById('t-badge3').innerText = t.badge3;

        const sensorBtn = document.getElementById('sensorBtn');
        sensorBtn.innerText = isSensoring ? t.sensorStop : t.sensorStart;
    }

    function updateUI() {
        let points = Math.floor(currentSteps / 100);
        if (currentSteps >= 8000) { points += 50; }

        document.getElementById('steps').innerText = currentSteps.toLocaleString();
        document.getElementById('points').innerText = points.toLocaleString() + " 🪙";
        document.getElementById('user-lb').innerText = points.toLocaleString() + " 🪙";

        if (currentSteps >= 1) { document.getElementById('badge-1').classList.add('badge-unlocked'); }
        else { document.getElementById('badge-1').classList.remove('badge-unlocked'); }

        if (currentSteps >= 8000) { document.getElementById('badge-2').classList.add('badge-unlocked'); }
        else { document.getElementById('badge-2').classList.remove('badge-unlocked'); }
    }

    function addSteps(count) {
        currentSteps += count;
        localStorage.setItem('stepifi_steps', currentSteps);
        updateUI();
    }

    function resetData() {
        if(confirm(translations[currentLang].confirmReset)) {
            currentSteps = 0;
            localStorage.removeItem('stepifi_steps');
            updateUI();
        }
    }

    function toggleSensor() {
        const btn = document.getElementById('sensorBtn');
        const t = translations[currentLang];
        if (!isSensoring) {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission().then(response => {
                    if (response === 'granted') { startMotion(); }
                });
            } else if (window.DeviceMotionEvent) {
                startMotion();
            } else {
                alert("Sensor not supported");
            }
        } else {
            window.removeEventListener('devicemotion', handleMotion);
            isSensoring = false;
            btn.innerText = t.sensorStart;
            btn.style.backgroundColor = "#a855f7";
        }
    }

    function startMotion() {
        window.addEventListener('devicemotion', handleMotion);
        isSensoring = true;
        const btn = document.getElementById('sensorBtn');
        btn.innerText = translations[currentLang].sensorStop;
        btn.style.backgroundColor = "#ef4444";
    }

    function handleMotion(event) {
        let acc = event.accelerationIncludingGravity;
        if (!acc) return;
        let total = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
        let delta = Math.abs(total - lastAccel);
        if (delta > 11) { addSteps(1); }
        lastAccel = total;
    }

    // التهيئة الأولية
    document.getElementById('langSelect').value = currentLang;
    applyTheme();
    changeLanguage(currentLang);
    updateUI();
</script>

</body>
</html>
