<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StepiFi - عداد الخطوات والنقاط</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 350px;
        }
        h1 { color: #38bdf8; margin-bottom: 15px; font-size: 24px; }
        .stat-box {
            background: #334155;
            padding: 12px;
            margin: 10px 0;
            border-radius: 12px;
        }
        .number { font-size: 28px; font-weight: bold; color: #4ade80; }
        .points { color: #facc15; }
        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px 0 20px 0;
            width: 100%;
        }
        button:hover { background-color: #7dd3fc; }
        
        /* تصميم لوحة المتصدرين */
        .leaderboard {
            background-color: #0f172a;
            border-radius: 12px;
            padding: 15px;
            text-align: right;
        }
        .leaderboard h3 {
            margin-top: 0;
            color: #facc15;
            font-size: 16px;
            text-align: center;
        }
        .player-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #334155;
            font-size: 14px;
        }
        .player-row:last-child { border-bottom: none; }
        .my-score { color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h1>🏃‍♂️ StepiFi</h1>
    
    <div class="stat-box">
        <div>عدد الخطوات اليوم:</div>
        <div class="number" id="steps">0</div>
    </div>

    <div class="stat-box">
        <div>مجموع النقاط:</div>
        <div class="number points" id="points">0 🪙</div>
    </div>

    <button onclick="addSteps()">محاكاة مشي (1000 خطوة)</button>

    <!-- لوحة المتصدرين -->
    <div class="leaderboard">
        <h3>🏆 قائمة المتصدرين أسبوعياً</h3>
        <div class="player-row"><span>1. أمين 🥇</span><span>250 🪙</span></div>
        <div class="player-row"><span>2. سارة 🥈</span><span>180 🪙</span></div>
        <div class="player-row my-score"><span>3. أنت (حسابك) 🥉</span><span id="user-leaderboard-points">0 🪙</span></div>
        <div class="player-row"><span>4. كريم</span><span>100 🪙</span></div>
    </div>
</div>

<script>
    let currentSteps = 0;

    function addSteps() {
        currentSteps += 1000;
        let points = Math.floor(currentSteps / 100) * 1;

        if (currentSteps >= 8000) {
            points += 50;
        }

        document.getElementById('steps').innerText = currentSteps.toLocaleString();
        document.getElementById('points').innerText = points.toLocaleString() + " 🪙";
        document.getElementById('user-leaderboard-points').innerText = points.toLocaleString() + " 🪙";
    }
</script>

</body>
    </html>
