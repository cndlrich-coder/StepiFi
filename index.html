<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StepiFi</title>
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- مكتبة Chart.js للرسم البياني -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --stat-bg: #334155;
            --text-color: #ffffff;
            --subtext-color: #94a3b8;
            --border-color: #334155;
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --stat-bg: #e2e8f0;
            --text-color: #0f172a;
            --subtext-color: #64748b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            user-select: none;
            transition: background-color 0.3s, color 0.3s;
        }
        .container { width: 100%; max-width: 380px; }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .top-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }
        h1 { color: #38bdf8; margin: 0 0 15px 0; font-size: 26px; }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .stat-box {
            background: var(--stat-bg);
            padding: 10px;
            border-radius: 12px;
            transition: background-color 0.3s;
        }
        .number { font-size: 22px; font-weight: bold; color: #22c55e; }
        .points { color: #eab308; }
        .gps-val { color: #38bdf8; }

        .nav-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }
        .tab-btn {
            flex: 1;
            padding: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        button.action-btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin: 6px 0;
            transition: transform 0.1s;
        }
        button.action-btn:active { transform: scale(0.98); }
        .gps-btn { background-color: #10b981; color: #fff; }
        .sensor-btn { background-color: #a855f7; color: #fff; }
        
        .reset-btn {
            background-color: transparent;
            color: var(--subtext-color);
            font-size: 12px;
            text-decoration: underline;
            margin-top: 2px;
            border: none;
            cursor: pointer;
        }

        .leaderboard {
            background-color: var(--bg-color);
            border-radius: 12px;
            padding: 12px;
            margin-top: 10px;
        }
        .leaderboard h3 { color: #eab308; text-align: center; margin: 0 0 10px 0; font-size: 15px; }
        .player-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }
        .my-score { color: #38bdf8; font-weight: bold; }
        .chart-container {
            position: relative;
            margin-top: 15px;
            height: 220px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <button class="top-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
        <select class="top-btn" id="langSelect" onchange="changeLanguage(this.value)">
            <option value="ar">العربية 🇸🇦</option>
            <option value="fr">Français 🇫🇷</option>
            <option value="en">English 🇬🇧</option>
        </select>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('home')" id="tab-home-btn">الرئيسية 🏠</button>
        <button class="tab-btn" onclick="switchTab('stats')" id="tab-stats-btn">الإحصائيات 📊</button>
    </div>

    <div id="tab-home" class="tab-content active">
        <div class="card">
            <h1>🏃‍♂️ StepiFi</h1>
            
            <div class="grid-2">
                <div class="stat-box">
                    <div>الخطوات:</div>
                    <div class="number" id="steps">0</div>
                </div>
                <div class="stat-box">
                    <div>النقاط:</div>
                    <div class="number points" id="points">0 🪙</div>
                </div>
            </div>

            <div class="grid-2">
                <div class="stat-box">
                    <div>المسافة:</div>
                    <div class="number gps-val" id="distance">0.0 km</div>
                </div>
                <div class="stat-box">
                    <div>السعرات:</div>
                    <div class="number gps-val" id="calories">0 kcal</div>
                </div>
            </div>

            <button class="action-btn gps-btn" id="gpsBtn" onclick="toggleGPS()">تفعيل تتبع GPS 📍</button>
            <button class="action-btn sensor-btn" id="sensorBtn" onclick="toggleSensor()">تفعيل مستشعر الحركة 📱</button>
            <button class="action-btn" id="t-sim-btn" onclick="addSteps(1000)">محاكاة (+1000 خطوة)</button>
            <br>
            <button class="reset-btn" id="t-reset-btn" onclick="resetData()">إعادة ضبط العداد</button>

            <div class="leaderboard">
                <h3>🏆 المتصدرون أسبوعياً</h3>
                <div class="player-row"><span>🥇 Amine</span><span>250 🪙</span></div>
                <div class="player-row"><span>🥈 Sarah</span><span>180 🪙</span></div>
                <div class="player-row my-score"><span>🥉 أنت (حسابك)</span><span id="user-lb">0 🪙</span></div>
            </div>
        </div>
    </div>

    <!-- تبويب الإحصائيات مع الرسم البياني -->
    <div id="tab-stats" class="tab-content">
        <div class="card">
            <h3>📊 إحصائيات النشاط الأسبوعي</h3>
            <div class="grid-2" style="margin-top:15px;">
                <p style="margin:0; font-size:13px;">المسافة: <b id="total-dist" style="color:#38bdf8">0 km</b></p>
                <p style="margin:0; font-size:13px;">السعرات: <b id="total-cal" style="color:#22c55e">0 kcal</b></p>
            </div>
            
            <div class="chart-container">
                <canvas id="stepsChart"></canvas>
            </div>
        </div>
    </div>

</div>

<script>
    let currentSteps = parseInt(localStorage.getItem('stepifi_steps')) || 0;
    let totalDistance = parseFloat(localStorage.getItem('stepifi_dist')) || 0;
    let isDarkMode = localStorage.getItem('stepifi_theme') !== 'light';
    
    let isSensoring = false;
    let isGPSActive = false;
    let watchID = null;
    let lastLat = null;
    let lastLon = null;
    let lastAccel = 0;
    let myChart = null;

    function switchTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tabName).classList.add('active');
        document.getElementById('tab-' + tabName + '-btn').classList.add('active');
        if (tabName === 'stats') { initChart(); }
    }

    function applyTheme() {
        if (isDarkMode) {
            document.body.classList.remove('light-mode');
            document.getElementById('themeBtn').innerText = "🌙 Dark";
        } else {
            document.body.classList.add('light-mode');
            document.getElementById('themeBtn').innerText = "☀️ Light";
        }
        if (myChart) { initChart(); }
    }

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        localStorage.setItem('stepifi_theme', isDarkMode ? 'dark' : 'light');
        applyTheme();
    }

    function updateUI() {
        let points = Math.floor(currentSteps / 100);
        let calories = Math.floor(currentSteps * 0.04);

        document.getElementById('steps').innerText = currentSteps.toLocaleString();
        document.getElementById('points').innerText = points.toLocaleString() + " 🪙";
        document.getElementById('user-lb').innerText = points.toLocaleString() + " 🪙";
        document.getElementById('distance').innerText = totalDistance.toFixed(2) + " km";
        document.getElementById('calories').innerText = calories + " kcal";
        
        document.getElementById('total-dist').innerText = totalDistance.toFixed(2) + " km";
        document.getElementById('total-cal').innerText = calories + " kcal";
        
        if (myChart) { updateChartData(); }
    }

    function addSteps(count) {
        currentSteps += count;
        totalDistance += (count * 0.00075);
        localStorage.setItem('stepifi_steps', currentSteps);
        localStorage.setItem('stepifi_dist', totalDistance);
        updateUI();
    }

    function initChart() {
        const ctx = document.getElementById('stepsChart').getContext('2d');
        const textColor = isDarkMode ? '#ffffff' : '#0f172a';
        const gridColor = isDarkMode ? '#334155' : '#cbd5e1';

        if (myChart) { myChart.destroy(); }

        myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت', 'اليوم'],
                datasets: [{
                    label: 'الخطوات',
                    data: [3200, 4500, 2100, 6000, 5200, 4100, currentSteps],
                    backgroundColor: '#38bdf8',
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    x: { ticks: { color: textColor }, grid: { display: false } },
                    y: { ticks: { color: textColor }, grid: { color: gridColor } }
                }
            }
        });
    }

    function updateChartData() {
        if (myChart) {
            myChart.data.datasets[0].data[6] = currentSteps;
            myChart.update();
        }
    }

    function toggleGPS() {
        const btn = document.getElementById('gpsBtn');
        if (!isGPSActive) {
            if ("geolocation" in navigator) {
                watchID = navigator.geolocation.watchPosition(updateGPSPosition, handleGPSError, { enableHighAccuracy: true });
                isGPSActive = true;
                btn.innerText = "تتبع GPS يعمل... 📍 (إيقاف)";
                btn.style.backgroundColor = "#ef4444";
            }
        } else {
            navigator.geolocation.clearWatch(watchID);
            isGPSActive = false;
            btn.innerText = "تفعيل تتبع GPS 📍";
            btn.style.backgroundColor = "#10b981";
        }
    }

    function updateGPSPosition(position) {
        let lat = position.coords.latitude;
        let lon = position.coords.longitude;
        if (lastLat !== null && lastLon !== null) {
            let dist = calculateDistance(lastLat, lastLon, lat, lon);
            if (dist > 0.005) {
                totalDistance += dist;
                currentSteps += Math.round(dist / 0.00075);
                localStorage.setItem('stepifi_steps', currentSteps);
                localStorage.setItem('stepifi_dist', totalDistance);
                updateUI();
            }
        }
        lastLat = lat;
        lastLon = lon;
    }

    function handleGPSError() { alert("يرجى تفعيل صلاحية الـ GPS"); }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function resetData() {
        if(confirm("إعادة ضبط العداد والموقع للصفر؟")) {
            currentSteps = 0;
            totalDistance = 0;
            localStorage.removeItem('stepifi_steps');
            localStorage.removeItem('stepifi_dist');
            updateUI();
        }
    }

    function toggleSensor() {
        const btn = document.getElementById('sensorBtn');
        if (!isSensoring) {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission().then(resp => { if (resp === 'granted') startMotion(); });
            } else if (window.DeviceMotionEvent) { startMotion(); }
        } else {
            window.removeEventListener('devicemotion', handleMotion);
            isSensoring = false;
            btn.innerText = "تفعيل مستشعر الحركة 📱";
            btn.style.backgroundColor = "#a855f7";
        }
    }

    function startMotion() {
        window.addEventListener('devicemotion', handleMotion);
        isSensoring = true;
        const btn = document.getElementById('sensorBtn');
        btn.innerText = "المستشعر يعمل... 🛑";
        btn.style.backgroundColor = "#ef4444";
    }

    function handleMotion(event) {
        let acc = event.accelerationIncludingGravity;
        if (!acc) return;
        let total = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
        if (Math.abs(total - lastAccel) > 11) { addSteps(1); }
        lastAccel = total;
    }

    applyTheme();
    updateUI();
</script>

</body>
</html>
