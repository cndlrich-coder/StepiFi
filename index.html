<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StepiFi Pro</title>
    <meta name="theme-color" content="#0f172a">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #ffffff;
            --subtext-color: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-orange: #f97316;
            --accent-green: #22c55e;
            --border-color: #334155;
        }

        body.light-mode {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --subtext-color: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            user-select: none;
            transition: background-color 0.3s;
        }

        .container { width: 100%; max-width: 390px; }

        /* شريط علوي بسيط */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 10px 15px;
        }
        .top-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }

        /* كارت المتر المزدوج العلوي */
        .stats-header {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            text-align: center;
            background: var(--card-bg);
            padding: 15px 10px;
            border-radius: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .stat-item .val { font-size: 20px; font-weight: bold; margin-top: 4px; }
        .stat-item .lbl { font-size: 12px; color: var(--subtext-color); }
        .c-orange { color: var(--accent-orange); }
        .c-green { color: var(--accent-green); }
        .c-blue { color: var(--accent-blue); }

        /* الحلقة الدائرية الرئيسية */
        .ring-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px 10px;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 15px;
        }

        .circle-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto;
        }

        .circle-container svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .circle-bg {
            fill: none;
            stroke: var(--border-color);
            stroke-width: 12;
        }

        .circle-progress {
            fill: none;
            stroke: var(--accent-blue);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: 565;
            stroke-dashoffset: 565; /* يكتمل بالـ JS */
            transition: stroke-dashoffset 0.5s ease;
        }

        .circle-inner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .circle-inner .today { font-size: 12px; color: var(--subtext-color); margin-bottom: 2px; }
        .circle-inner .steps-count { font-size: 38px; font-weight: 800; color: var(--accent-blue); }
        .circle-inner .target { font-size: 11px; color: var(--subtext-color); margin-top: 2px; }

        /* الأزرار العلوية */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn-act {
            padding: 12px;
            border-radius: 14px;
            border: none;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            color: #fff;
        }
        .btn-gps { background: #10b981; }
        .btn-sim { background: #a855f7; }

        /* قسم الرسم البياني المصغر */
        .chart-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 15px;
            height: 160px;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- الشريط العلوي -->
    <div class="top-bar">
        <button class="top-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
        <span style="font-weight: bold; font-size: 16px;">StepiFi</span>
        <button class="top-btn" onclick="resetData()">⚙️ إلغاء</button>
    </div>

    <!-- الإحصائيات العلوية الثلاثية -->
    <div class="stats-header">
        <div class="stat-item">
            <div class="lbl">السعرات</div>
            <div class="val c-orange" id="calories">0</div>
        </div>
        <div class="stat-item">
            <div class="lbl">وقت النشاط</div>
            <div class="val c-green" id="activeTime">0m</div>
        </div>
        <div class="stat-item">
            <div class="lbl">المسافة (Km)</div>
            <div class="val c-blue" id="distance">0.0</div>
        </div>
    </div>

    <!-- الحلقة الدائرية العداد -->
    <div class="ring-card">
        <div class="circle-container">
            <svg>
                <circle class="circle-bg" cx="110" cy="110" r="90"></circle>
                <circle class="circle-progress" id="progressRing" cx="110" cy="110" r="90"></circle>
            </svg>
            <div class="circle-inner">
                <div class="today">اليوم 📅</div>
                <div class="steps-count" id="steps">0</div>
                <div class="target">الهدف: 10,000 خطوة</div>
            </div>
        </div>
    </div>

    <!-- الأزرار -->
    <div class="controls-grid">
        <button class="btn-act btn-gps" id="gpsBtn" onclick="toggleGPS()">تتبع GPS 📍</button>
        <button class="btn-act btn-sim" onclick="addSteps(500)">+500 خطوة 🏃‍♂️</button>
    </div>

    <!-- الرسم البياني الأسبوعي المصغر -->
    <div class="chart-card">
        <canvas id="miniChart"></canvas>
    </div>

</div>

<script>
    let currentSteps = parseInt(localStorage.getItem('stepifi_steps')) || 0;
    let totalDistance = parseFloat(localStorage.getItem('stepifi_dist')) || 0;
    let isDarkMode = localStorage.getItem('stepifi_theme') !== 'light';
    let isGPSActive = false;
    let watchID = null;
    let lastLat = null, lastLon = null;
    let miniChart = null;

    const GOAL_STEPS = 10000;
    const CIRCLE_RADIUS = 90;
    const CIRCLE_CIRCUMFERENCE = 2 * Math.PI * CIRCLE_RADIUS;

    function applyTheme() {
        if (isDarkMode) {
            document.body.classList.remove('light-mode');
            document.getElementById('themeBtn').innerText = "🌙 Dark";
        } else {
            document.body.classList.add('light-mode');
            document.getElementById('themeBtn').innerText = "☀️ Light";
        }
        if(miniChart) initMiniChart();
    }

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        localStorage.setItem('stepifi_theme', isDarkMode ? 'dark' : 'light');
        applyTheme();
    }

    function updateUI() {
        let calories = Math.floor(currentSteps * 0.04);
        let minutesActive = Math.floor(currentSteps / 100); // تقدير دقيقة لكل 100 خطوة

        document.getElementById('steps').innerText = currentSteps.toLocaleString();
        document.getElementById('calories').innerText = calories;
        document.getElementById('activeTime').innerText = minutesActive + "m";
        document.getElementById('distance').innerText = totalDistance.toFixed(1);

        // تحديث الحلقة الدائرية
        let percent = Math.min(currentSteps / GOAL_STEPS, 1);
        let offset = CIRCLE_CIRCUMFERENCE - (percent * CIRCLE_CIRCUMFERENCE);
        document.getElementById('progressRing').style.strokeDashoffset = offset;

        if (miniChart) {
            miniChart.data.datasets[0].data[6] = currentSteps;
            miniChart.update();
        }
    }

    function addSteps(count) {
        currentSteps += count;
        totalDistance += (count * 0.00075);
        localStorage.setItem('stepifi_steps', currentSteps);
        localStorage.setItem('stepifi_dist', totalDistance);
        updateUI();
    }

    function toggleGPS() {
        const btn = document.getElementById('gpsBtn');
        if (!isGPSActive) {
            if ("geolocation" in navigator) {
                watchID = navigator.geolocation.watchPosition(updateGPSPosition, null, { enableHighAccuracy: true });
                isGPSActive = true;
                btn.innerText = "توقف GPS 🛑";
                btn.style.backgroundColor = "#ef4444";
            }
        } else {
            navigator.geolocation.clearWatch(watchID);
            isGPSActive = false;
            btn.innerText = "تتبع GPS 📍";
            btn.style.backgroundColor = "#10b981";
        }
    }

    function updateGPSPosition(pos) {
        let lat = pos.coords.latitude, lon = pos.coords.longitude;
        if (lastLat !== null && lastLon !== null) {
            let dist = calculateDistance(lastLat, lastLon, lat, lon);
            if (dist > 0.005) {
                totalDistance += dist;
                currentSteps += Math.round(dist / 0.00075);
                localStorage.setItem('stepifi_steps', currentSteps);
                localStorage.setItem('stepifi_dist', totalDistance);
                updateUI();
            }
        }
        lastLat = lat; lastLon = lon;
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function initMiniChart() {
        const ctx = document.getElementById('miniChart').getContext('2d');
        const textColor = isDarkMode ? '#94a3b8' : '#64748b';

        if (miniChart) miniChart.destroy();

        miniChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'اليوم'],
                datasets: [{
                    data: [1200, 3100, 2500, 4200, 1800, 2900, currentSteps],
                    borderColor: '#38bdf8',
                    borderWidth: 3,
                    tension: 0.4,
                    pointRadius: 3,
                    pointBackgroundColor: '#38bdf8'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { ticks: { color: textColor, font: { size: 10 } }, grid: { display: false } },
                    y: { display: false }
                }
            }
        });
    }

    function resetData() {
        if(confirm("تصفير البيانات؟")) {
            currentSteps = 0; totalDistance = 0;
            localStorage.clear();
            updateUI();
        }
    }

    applyTheme();
    updateUI();
    initMiniChart();
</script>

</body>
</html>
