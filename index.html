<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StepiFi Pro</title>
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- مكتبة Chart.js للرسم البياني -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --stat-bg: #334155;
            --text-color: #ffffff;
            --subtext-color: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-orange: #f97316;
            --accent-green: #22c55e;
            --border-color: #334155;
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --stat-bg: #e2e8f0;
            --text-color: #0f172a;
            --subtext-color: #64748b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            user-select: none;
            transition: background-color 0.3s, color 0.3s;
        }

        .container { width: 100%; max-width: 390px; }

        /* الشريط العلوي */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .top-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }

        /* كارت المتر المزدوج العلوي */
        .stats-header {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            text-align: center;
            background: var(--card-bg);
            padding: 12px 8px;
            border-radius: 20px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: background-color 0.3s;
        }
        .stat-item .val { font-size: 18px; font-weight: bold; margin-top: 4px; }
        .stat-item .lbl { font-size: 11px; color: var(--subtext-color); }
        .c-orange { color: var(--accent-orange); }
        .c-green { color: var(--accent-green); }
        .c-blue { color: var(--accent-blue); }

        /* الحلقة الدائرية الرئيسية */
        .ring-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 18px 10px;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 12px;
            transition: background-color 0.3s;
        }

        .circle-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto;
        }

        .circle-container svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .circle-bg {
            fill: none;
            stroke: var(--border-color);
            stroke-width: 12;
        }

        .circle-progress {
            fill: none;
            stroke: var(--accent-blue);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: 565;
            stroke-dashoffset: 565;
            transition: stroke-dashoffset 0.5s ease;
        }

        .circle-inner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .circle-inner .today { font-size: 12px; color: var(--subtext-color); margin-bottom: 2px; }
        .circle-inner .steps-count { font-size: 34px; font-weight: 800; color: var(--accent-blue); }
        .circle-inner .points-lbl { font-size: 14px; font-weight: bold; color: #eab308; margin-top: 2px; }

        /* الأزرار التحكمية */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }
        .btn-act {
            padding: 10px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            color: #fff;
            transition: transform 0.1s;
        }
        .btn-act:active { transform: scale(0.98); }
        .btn-gps { background: #10b981; }
        .btn-sensor { background: #a855f7; }
        .btn-sim { background: var(--accent-blue); color: #0f172a; grid-column: span 2; }

        .reset-btn {
            background-color: transparent;
            color: var(--subtext-color);
            font-size: 11px;
            text-decoration: underline;
            border: none;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
        }

        /* الرسم البياني الأسبوعي */
        .chart-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 12px;
            height: 150px;
            margin-bottom: 12px;
            transition: background-color 0.3s;
        }

        /* المتصدرين */
        .leaderboard {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 14px;
            margin-bottom: 12px;
            transition: background-color 0.3s;
        }
        .leaderboard h3 { color: #eab308; text-align: center; margin: 0 0 10px 0; font-size: 14px; }
        .player-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }
        .my-score { color: var(--accent-blue); font-weight: bold; }

        /* الأوسمة */
        .badges-card {
            background-color: var(--card-bg);
            padding: 14px;
            border-radius: 20px;
            transition: background-color 0.3s;
        }
        .badges-card h3 { text-align: center; margin: 0 0 10px 0; font-size: 14px; }
        .badges-grid { display: flex; justify-content: space-around; }
        .badge-item {
            background: var(--stat-bg);
            padding: 8px;
            border-radius: 12px;
            text-align: center;
            opacity: 0.3;
            width: 70px;
            transition: all 0.3s;
        }
        .badge-icon { font-size: 20px; }
        .badge-name { font-size: 9px; margin-top: 4px; }
        .badge-unlocked { opacity: 1; border: 2px solid #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.4); }
    </style>
</head>
<body>

<div class="container">
    
    <!-- الشريط العلوي (اللغات والنمط) -->
    <div class="top-bar">
        <button class="top-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
        <select class="top-btn" id="langSelect" onchange="changeLanguage(this.value)">
            <option value="ar">العربية 🇸🇦</option>
            <option value="fr">Français 🇫🇷</option>
            <option value="en">English 🇬🇧</option>
        </select>
    </div>

    <!-- الإحصائيات العلوية الثلاثية -->
    <div class="stats-header">
        <div class="stat-item">
            <div class="lbl" id="t-lbl-cal">السعرات</div>
            <div class="val c-orange" id="calories">0</div>
        </div>
        <div class="stat-item">
            <div class="lbl" id="t-lbl-time">وقت النشاط</div>
            <div class="val c-green" id="activeTime">0m</div>
        </div>
        <div class="stat-item">
            <div class="lbl" id="t-lbl-dist">المسافة (Km)</div>
            <div class="val c-blue" id="distance">0.0</div>
        </div>
    </div>

    <!-- الحلقة الدائرية العداد -->
    <div class="ring-card">
        <div class="circle-container">
            <svg>
                <circle class="circle-bg" cx="100" cy="100" r="85"></circle>
                <circle class="circle-progress" id="progressRing" cx="100" cy="100" r="85"></circle>
            </svg>
            <div class="circle-inner">
                <div class="today" id="t-today">اليوم 📅</div>
                <div class="steps-count" id="steps">0</div>
                <div class="points-lbl" id="points">0 🪙</div>
            </div>
        </div>
    </div>

    <!-- أزرار التحكم -->
    <div class="controls-grid">
        <button class="btn-act btn-gps" id="gpsBtn" onclick="toggleGPS()">تتبع GPS 📍</button>
        <button class="btn-act btn-sensor" id="sensorBtn" onclick="toggleSensor()">مستشعر الحركة 📱</button>
        <button class="btn-act btn-sim" id="t-sim-btn" onclick="addSteps(1000)">محاكاة (+1000 خطوة) 🏃‍♂️</button>
    </div>
    <button class="reset-btn" id="t-reset-btn" onclick="resetData()">إعادة ضبط العداد</button>

    <!-- الرسم البياني الأسبوعي -->
    <div class="chart-card">
        <canvas id="miniChart"></canvas>
    </div>

    <!-- قائمة المتصدرين -->
    <div class="leaderboard">
        <h3 id="t-lb-title">🏆 المتصدرون أسبوعياً</h3>
        <div class="player-row"><span>🥇 Amine</span><span>250 🪙</span></div>
        <div class="player-row"><span>🥈 Sarah</span><span>180 🪙</span></div>
        <div class="player-row my-score"><span id="t-user-row">🥉 أنت (حسابك)</span><span id="user-lb">0 🪙</span></div>
        <div class="player-row"><span>4. Karim</span><span>100 🪙</span></div>
    </div>

    <!-- أوسمة الإنجاز -->
    <div class="badges-card">
        <h3 id="t-badges-title">🏅 أوسمة الإنجاز</h3>
        <div class="badges-grid">
            <div class="badge-item" id="badge-1">
                <div class="badge-icon">👣</div>
                <div class="badge-name" id="t-badge1">الخطوة الأولى</div>
            </div>
            <div class="badge-item" id="badge-2">
                <div class="badge-icon">🎯</div>
                <div class="badge-name" id="t-badge2">الهدف اليومي</div>
            </div>
            <div class="badge-item badge-unlocked">
                <div class="badge-icon">🔥</div>
                <div class="badge-name" id="t-badge3">المثابر</div>
            </div>
        </div>
    </div>

</div>

<script>
    let currentSteps = parseInt(localStorage.getItem('stepifi_steps')) || 0;
    let totalDistance = parseFloat(localStorage.getItem('stepifi_dist')) || 0;
    let currentLang = localStorage.getItem('stepifi_lang') || 'ar';
    let isDarkMode = localStorage.getItem('stepifi_theme') !== 'light';
    
    let isSensoring = false;
    let isGPSActive = false;
    let watchID = null;
    let lastLat = null, lastLon = null;
    let lastAccel = 0;
    let miniChart = null;

    const GOAL_STEPS = 10000;
    const CIRCLE_RADIUS = 85;
    const CIRCLE_CIRCUMFERENCE = 2 * Math.PI * CIRCLE_RADIUS;

    const translations = {
        ar: {
            cal: "السعرات",
            time: "وقت النشاط",
            dist: "المسافة (Km)",
            today: "اليوم 📅",
            gpsStart: "تتبع GPS 📍",
            gpsStop: "توقف GPS 🛑",
            sensorStart: "مستشعر الحركة 📱",
            sensorStop: "إيقاف المستشعر 🛑",
            simBtn: "محاكاة (+1000 خطوة) 🏃‍♂️",
            resetBtn: "إعادة ضبط العداد",
            lbTitle: "🏆 المتصدرون أسبوعياً",
            userRow: "🥉 أنت (حسابك)",
            badgesTitle: "🏅 أوسمة الإنجاز",
            badge1: "الخطوة الأولى",
            badge2: "الهدف اليومي",
            badge3: "المثابر",
            confirmReset: "هل تريد إعادة ضبط العداد للصفر؟",
            chartDays: ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'اليوم']
        },
        fr: {
            cal: "Calories",
            time: "Temps Actif",
            dist: "Distance (Km)",
            today: "Aujourd'hui 📅",
            gpsStart: "Suivi GPS 📍",
            gpsStop: "Arrêter GPS 🛑",
            sensorStart: "Capteur Motion 📱",
            sensorStop: "Arrêter Capteur 🛑",
            simBtn: "Simulation (+1000 Pas) 🏃‍♂️",
            resetBtn: "Réinitialiser",
            lbTitle: "🏆 Classement Hebdo",
            userRow: "🥉 Vous (Votre Compte)",
            badgesTitle: "🏅 Badges d'Étape",
            badge1: "Premier Pas",
            badge2: "Objectif Jour",
            badge3: "Persévérant",
            confirmReset: "Voulez-vous réinitialiser les données ?",
            chartDays: ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Aujourd.']
        },
        en: {
            cal: "Calories",
            time: "Active Time",
            dist: "Distance (Km)",
            today: "Today 📅",
            gpsStart: "GPS Tracking 📍",
            gpsStop: "Stop GPS 🛑",
            sensorStart: "Motion Sensor 📱",
            sensorStop: "Stop Sensor 🛑",
            simBtn: "Simulate (+1000 Steps) 🏃‍♂️",
            resetBtn: "Reset Counter",
            lbTitle: "🏆 Weekly Leaderboard",
            userRow: "🥉 You (Your Account)",
            badgesTitle: "🏅 Achievement Badges",
            badge1: "First Step",
            badge2: "Daily Goal",
            badge3: "Persistent",
            confirmReset: "Do you want to reset all data?",
            chartDays: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Today']
        }
    };

    function applyTheme() {
        if (isDarkMode) {
            document.body.classList.remove('light-mode');
            document.getElementById('themeBtn').innerText = "🌙 Dark";
        } else {
            document.body.classList.add('light-mode');
            document.getElementById('themeBtn').innerText = "☀️ Light";
        }
        if(miniChart) initMiniChart();
    }

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        localStorage.setItem('stepifi_theme', isDarkMode ? 'dark' : 'light');
        applyTheme();
    }

    function changeLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('stepifi_lang', lang);
        document.documentElement.lang = lang;
        document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
        
        const t = translations[lang];
        document.getElementById('t-lbl-cal').innerText = t.cal;
        document.getElementById('t-lbl-time').innerText = t.time;
        document.getElementById('t-lbl-dist').innerText = t.dist;
        document.getElementById('t-today').innerText = t.today;
        document.getElementById('t-sim-btn').innerText = t.simBtn;
        document.getElementById('t-reset-btn').innerText = t.resetBtn;
        document.getElementById('t-lb-title').innerText = t.lbTitle;
        document.getElementById('t-user-row').innerText = t.userRow;
        document.getElementById('t-badges-title').innerText = t.badgesTitle;
        document.getElementById('t-badge1').innerText = t.badge1;
        document.getElementById('t-badge2').innerText = t.badge2;
        document.getElementById('t-badge3').innerText = t.badge3;

        document.getElementById('gpsBtn').innerText = isGPSActive ? t.gpsStop : t.gpsStart;
        document.getElementById('sensorBtn').innerText = isSensoring ? t.sensorStop : t.sensorStart;

        if (miniChart) initMiniChart();
    }

    function updateUI() {
        let points = Math.floor(currentSteps / 100);
        let calories = Math.floor(currentSteps * 0.04);
        let minutesActive = Math.floor(currentSteps / 100);

        document.getElementById('steps').innerText = currentSteps.toLocaleString();
        document.getElementById('points').innerText = points.toLocaleString() + " 🪙";
        document.getElementById('user-lb').innerText = points.toLocaleString() + " 🪙";
        document.getElementById('calories').innerText = calories;
        document.getElementById('activeTime').innerText = minutesActive + "m";
        document.getElementById('distance').innerText = totalDistance.toFixed(1);

        // الحلقة الدائرية
        let percent = Math.min(currentSteps / GOAL_STEPS, 1);
        let offset = CIRCLE_CIRCUMFERENCE - (percent * CIRCLE_CIRCUMFERENCE);
        document.getElementById('progressRing').style.strokeDashoffset = offset;

        // تحديث الأوسمة
        if (currentSteps >= 1) { document.getElementById('badge-1').classList.add('badge-unlocked'); }
        else { document.getElementById('badge-1').classList.remove('badge-unlocked'); }

        if (currentSteps >= GOAL_STEPS) { document.getElementById('badge-2').classList.add('badge-unlocked'); }
        else { document.getElementById('badge-2').classList.remove('badge-unlocked'); }

        if (miniChart) {
            miniChart.data.datasets[0].data[6] = currentSteps;
            miniChart.update();
        }
    }

    function addSteps(count) {
        currentSteps += count;
        totalDistance += (count * 0.00075);
        localStorage.setItem('stepifi_steps', currentSteps);
        localStorage.setItem('stepifi_dist', totalDistance);
        updateUI();
    }

    function toggleGPS() {
        const btn = document.getElementById('gpsBtn');
        const t = translations[currentLang];
        if (!isGPSActive) {
            if ("geolocation" in navigator) {
                watchID = navigator.geolocation.watchPosition(updateGPSPosition, null, { enableHighAccuracy: true });
                isGPSActive = true;
                btn.innerText = t.gpsStop;
                btn.style.backgroundColor = "#ef4444";
            }
        } else {
            navigator.geolocation.clearWatch(watchID);
            isGPSActive = false;
            btn.innerText = t.gpsStart;
            btn.style.backgroundColor = "#10b981";
        }
    }

    function updateGPSPosition(pos) {
        let lat = pos.coords.latitude, lon = pos.coords.longitude;
        if (lastLat !== null && lastLon !== null) {
            let dist = calculateDistance(lastLat, lastLon, lat, lon);
            if (dist > 0.005) {
                totalDistance += dist;
                currentSteps += Math.round(dist / 0.00075);
                localStorage.setItem('stepifi_steps', currentSteps);
                localStorage.setItem('stepifi_dist', totalDistance);
                updateUI();
            }
        }
        lastLat = lat; lastLon = lon;
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function toggleSensor() {
        const btn = document.getElementById('sensorBtn');
        const t = translations[currentLang];
        if (!isSensoring) {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission().then(resp => { if (resp === 'granted') startMotion(); });
            } else if (window.DeviceMotionEvent) { startMotion(); }
        } else {
            window.removeEventListener('devicemotion', handleMotion);
            isSensoring = false;
            btn.innerText = t.sensorStart;
            btn.style.backgroundColor = "#a855f7";
        }
    }

    function startMotion() {
        window.addEventListener('devicemotion', handleMotion);
        isSensoring = true;
        const btn = document.getElementById('sensorBtn');
        btn.innerText = translations[currentLang].sensorStop;
        btn.style.backgroundColor = "#ef4444";
    }

    function handleMotion(event) {
        let acc = event.accelerationIncludingGravity;
        if (!acc) return;
        let total = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
        if (Math.abs(total - lastAccel) > 11) { addSteps(1); }
        lastAccel = total;
    }

    function initMiniChart() {
        const ctx = document.getElementById('miniChart').getContext('2d');
        const textColor = isDarkMode ? '#94a3b8' : '#64748b';

        if (miniChart) miniChart.destroy();

        miniChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: translations[currentLang].chartDays,
                datasets: [{
                    data: [1200, 3100, 2500, 4200, 1800, 2900, currentSteps],
                    borderColor: '#38bdf8',
                    borderWidth: 3,
                    tension: 0.4,
                    pointRadius: 3,
                    pointBackgroundColor: '#38bdf8'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { ticks: { color: textColor, font: { size: 10 } }, grid: { display: false } },
                    y: { display: false }
                }
            }
        });
    }

    function resetData() {
        if(confirm(translations[currentLang].confirmReset)) {
            currentSteps = 0; totalDistance = 0;
            localStorage.clear();
            updateUI();
        }
    }

    document.getElementById('langSelect').value = currentLang;
    applyTheme();
    changeLanguage(currentLang);
    updateUI();
</script>

</body>
</html>
