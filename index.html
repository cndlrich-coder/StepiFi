<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StepiFi</title>
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --stat-bg: #334155;
            --text-color: #ffffff;
            --subtext-color: #94a3b8;
            --border-color: #334155;
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --stat-bg: #e2e8f0;
            --text-color: #0f172a;
            --subtext-color: #64748b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            user-select: none;
            transition: background-color 0.3s, color 0.3s;
        }
        .container { width: 100%; max-width: 380px; }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .top-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }
        h1 { color: #38bdf8; margin: 0 0 15px 0; font-size: 26px; }
        .stat-box {
            background: var(--stat-bg);
            padding: 12px;
            margin: 8px 0;
            border-radius: 12px;
            transition: background-color 0.3s;
        }
        .number { font-size: 28px; font-weight: bold; color: #22c55e; }
        .points { color: #eab308; }

        .nav-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }
        .tab-btn {
            flex: 1;
            padding: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        button.action-btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin: 8px 0;
            transition: transform 0.1s;
        }
        button.action-btn:active { transform: scale(0.98); }
        .sensor-btn { background-color: #a855f7; color: #fff; }
        .reset-btn {
            background-color: transparent;
            color: var(--subtext-color);
            font-size: 12px;
            text-decoration: underline;
            margin-top: 2px;
            border: none;
            cursor: pointer;
        }

        /* الإحصائيات */
        .stats-grid {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 10px;
        }
        .stat-card {
            flex: 1;
            background: var(--stat-bg);
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
        }
        .stat-val { font-size: 16px; font-weight: bold; color: #38bdf8; margin-top: 4px; }

        /* المتجر */
        .reward-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--stat-bg);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .buy-btn {
            background: #22c55e;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .leaderboard {
            background-color: var(--bg-color);
            border-radius: 12px;
            padding: 12px;
            margin-top: 10px;
        }
        .leaderboard h3 { color: #eab308; text-align: center; margin: 0 0 10px 0; font-size: 15px; }
        .player-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }
        .my-score { color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <!-- شريط التحكم العلوي -->
    <div class="top-bar">
        <button class="top-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
        <select class="top-btn" id="langSelect" onchange="changeLanguage(this.value)">
            <option value="ar">العربية 🇸🇦</option>
            <option value="fr">Français 🇫🇷</option>
            <option value="en">English 🇬🇧</option>
        </select>
    </div>

    <!-- القائمة الرئيسية للملاحة -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('home')" id="tab-home-btn">الرئيسية 🏠</button>
        <button class="tab-btn" onclick="switchTab('stats')" id="tab-stats-btn">الإحصائيات 📊</button>
        <button class="tab-btn" onclick="switchTab('store')" id="tab-store-btn">المتجر 🎁</button>
    </div>

    <!-- تبويب الصفحة الرئيسية -->
    <div id="tab-home" class="tab-content active">
        <div class="card">
            <h1>🏃‍♂️ StepiFi</h1>
            <div class="stat-box">
                <div id="t-steps-label">خطوات اليوم:</div>
                <div class="number" id="steps">0</div>
            </div>
            <div class="stat-box">
                <div id="t-points-label">مجموع النقاط:</div>
                <div class="number points" id="points">0 🪙</div>
            </div>

            <button class="action-btn sensor-btn" id="sensorBtn" onclick="toggleSensor()">تفعيل عداد حركة الهاتف 📱</button>
            <button class="action-btn" id="t-sim-btn" onclick="addSteps(1000)">محاكاة (+1000 خطوة)</button>
            <br>
            <button class="reset-btn" id="t-reset-btn" onclick="resetData()">إعادة ضبط العداد</button>

            <div class="leaderboard">
                <h3 id="t-lb-title">🏆 المتصدرون أسبوعياً</h3>
                <div class="player-row"><span>🥇 Amine</span><span>250 🪙</span></div>
                <div class="player-row"><span>🥈 Sarah</span><span>180 🪙</span></div>
                <div class="player-row my-score"><span id="t-user-row">🥉 أنت (حسابك)</span><span id="user-lb">0 🪙</span></div>
                <div class="player-row"><span>4. Karim</span><span>100 🪙</span></div>
            </div>
        </div>
    </div>

    <!-- تبويب الإحصائيات -->
    <div id="tab-stats" class="tab-content">
        <div class="card">
            <h3 id="t-stats-title">📊 سجل ومعدل النشاط</h3>
            <div class="stats-grid">
                <div class="stat-card">
                    <div id="t-stat-day">اليوم</div>
                    <div class="stat-val" id="stat-daily">0</div>
                </div>
                <div class="stat-card">
                    <div id="t-stat-week">الأسبوع</div>
                    <div class="stat-val" id="stat-weekly">0</div>
                </div>
                <div class="stat-card">
                    <div id="t-stat-month">الشهر</div>
                    <div class="stat-val" id="stat-monthly">0</div>
                </div>
            </div>
        </div>
    </div>

    <!-- تبويب المتجر -->
    <div id="tab-store" class="tab-content">
        <div class="card">
            <h3 id="t-store-title">🎁 استبدال النقاط بالمكافآت</h3>
            
            <div class="reward-item">
                <div>
                    <div>☕ قسيمة قهوة مجانية</div>
                    <small style="color:var(--subtext-color)">50 🪙</small>
                </div>
                <button class="buy-btn" onclick="redeemReward(50, 'قسيمة قهوة')">استبدال</button>
            </div>

            <div class="reward-item">
                <div>
                    <div>🎧 خصم 20% سماعات</div>
                    <small style="color:var(--subtext-color)">150 🪙</small>
                </div>
                <button class="buy-btn" onclick="redeemReward(150, 'خصم السماعات')">استبدال</button>
            </div>

            <div class="reward-item">
                <div>
                    <div>💳 بطاقة هدايا 10$</div>
                    <small style="color:var(--subtext-color)">500 🪙</small>
                </div>
                <button class="buy-btn" onclick="redeemReward(500, 'بطاقة هدايا')">استبدال</button>
            </div>
        </div>
    </div>

</div>

<script>
    let currentSteps = parseInt(localStorage.getItem('stepifi_steps')) || 0;
    let currentLang = localStorage.getItem('stepifi_lang') || 'ar';
    let isDarkMode = localStorage.getItem('stepifi_theme') !== 'light';
    let isSensoring = false;
    let lastAccel = 0;

    const translations = {
        ar: {
            homeTab: "الرئيسية 🏠",
            statsTab: "الإحصائيات 📊",
            storeTab: "المتجر 🎁",
            stepsLabel: "خطوات اليوم:",
            pointsLabel: "مجموع النقاط:",
            sensorStart: "تفعيل عداد حركة الهاتف 📱",
            sensorStop: "العداد يعمل الآن... (إيقاف) 🛑",
            simBtn: "محاكاة (+1000 خطوة)",
            resetBtn: "إعادة ضبط العداد",
            lbTitle: "🏆 المتصدرون أسبوعياً",
            userRow: "🥉 أنت (حسابك)",
            statsTitle: "📊 سجل ومعدل النشاط",
            statDay: "اليوم",
            statWeek: "الأسبوع",
            statMonth: "الشهر",
            storeTitle: "🎁 استبدال النقاط بالمكافآت",
            confirmReset: "هل تريد إعادة ضبط الخطوات والنقاط للصفر؟"
        },
        fr: {
            homeTab: "Accueil 🏠",
            statsTab: "Stats 📊",
            storeTab: "Boutique 🎁",
            stepsLabel: "Pas d'aujourd'hui:",
            pointsLabel: "Total des Points:",
            sensorStart: "Activer le Capteur 📱",
            sensorStop: "Capteur Actif... (Arrêter) 🛑",
            simBtn: "Simulation (+1000 Pas)",
            resetBtn: "Réinitialiser",
            lbTitle: "🏆 Classement Hebdo",
            userRow: "🥉 Vous (Votre Compte)",
            statsTitle: "📊 Historique d'Activité",
            statDay: "Aujourd'hui",
            statWeek: "Semaine",
            statMonth: "Mois",
            storeTitle: "🎁 Échanger des Points",
            confirmReset: "Voulez-vous réinitialiser vos pas et points ?"
        },
        en: {
            homeTab: "Home 🏠",
            statsTab: "Stats 📊",
            storeTab: "Store 🎁",
            stepsLabel: "Today's Steps:",
            pointsLabel: "Total Points:",
            sensorStart: "Enable Motion Sensor 📱",
            sensorStop: "Sensor Active... (Stop) 🛑",
            simBtn: "Simulate (+1000 Steps)",
            resetBtn: "Reset Counter",
            lbTitle: "🏆 Weekly Leaderboard",
            userRow: "🥉 You (Your Account)",
            statsTitle: "📊 Activity History",
            statDay: "Today",
            statWeek: "Week",
            statMonth: "Month",
            storeTitle: "🎁 Redeem Rewards",
            confirmReset: "Do you want to reset your steps and points?"
        }
    };

    function switchTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById('tab-' + tabName).classList.add('active');
        document.getElementById('tab-' + tabName + '-btn').classList.add('active');
    }

    function applyTheme() {
        if (isDarkMode) {
            document.body.classList.remove('light-mode');
            document.getElementById('themeBtn').innerText = "🌙 Dark";
        } else {
            document.body.classList.add('light-mode');
            document.getElementById('themeBtn').innerText = "☀️ Light";
        }
    }

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        localStorage.setItem('stepifi_theme', isDarkMode ? 'dark' : 'light');
        applyTheme();
    }

    function changeLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('stepifi_lang', lang);
        document.documentElement.lang = lang;
        document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
        
        const t = translations[lang];
        document.getElementById('tab-home-btn').innerText = t.homeTab;
        document.getElementById('tab-stats-btn').innerText = t.statsTab;
        document.getElementById('tab-store-btn').innerText = t.storeTab;
        document.getElementById('t-steps-label').innerText = t.stepsLabel;
        document.getElementById('t-points-label').innerText = t.pointsLabel;
        document.getElementById('t-sim-btn').innerText = t.simBtn;
        document.getElementById('t-reset-btn').innerText = t.resetBtn;
        document.getElementById('t-lb-title').innerText = t.lbTitle;
        document.getElementById('t-user-row').innerText = t.userRow;
        document.getElementById('t-stats-title').innerText = t.statsTitle;
        document.getElementById('t-stat-day').innerText = t.statDay;
        document.getElementById('t-stat-week').innerText = t.statWeek;
        document.getElementById('t-stat-month').innerText = t.statMonth;
        document.getElementById('t-store-title').innerText = t.storeTitle;

        const sensorBtn = document.getElementById('sensorBtn');
        sensorBtn.innerText = isSensoring ? t.sensorStop : t.sensorStart;
    }

    function updateUI() {
        let points = Math.floor(currentSteps / 100);

        document.getElementById('steps').innerText = currentSteps.toLocaleString();
        document.getElementById('points').innerText = points.toLocaleString() + " 🪙";
        document.getElementById('user-lb').innerText = points.toLocaleString() + " 🪙";

        // تحديث الإحصائيات
        document.getElementById('stat-daily').innerText = currentSteps.toLocaleString();
        document.getElementById('stat-weekly').innerText = (currentSteps * 7).toLocaleString();
        document.getElementById('stat-monthly').innerText = (currentSteps * 30).toLocaleString();
    }

    function addSteps(count) {
        currentSteps += count;
        localStorage.setItem('stepifi_steps', currentSteps);
        updateUI();
    }

    function redeemReward(cost, rewardName) {
        let points = Math.floor(currentSteps / 100);
        if (points >= cost) {
            currentSteps -= (cost * 100);
            localStorage.setItem('stepifi_steps', currentSteps);
            updateUI();
            alert(`تهانينا! تم استبدال ${rewardName} بنجاح 🎉`);
        } else {
            alert(`نقاطك غير كافية! تحتاج إلى ${cost} نقطة.`);
        }
    }

    function resetData() {
        if(confirm(translations[currentLang].confirmReset)) {
            currentSteps = 0;
            localStorage.removeItem('stepifi_steps');
            updateUI();
        }
    }

    function toggleSensor() {
        const btn = document.getElementById('sensorBtn');
        const t = translations[currentLang];
        if (!isSensoring) {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission().then(response => {
                    if (response === 'granted') { startMotion(); }
                });
            } else if (window.DeviceMotionEvent) {
                startMotion();
            } else {
                alert("Sensor not supported");
            }
        } else {
            window.removeEventListener('devicemotion', handleMotion);
            isSensoring = false;
            btn.innerText = t.sensorStart;
            btn.style.backgroundColor = "#a855f7";
        }
    }

    function startMotion() {
        window.addEventListener('devicemotion', handleMotion);
        isSensoring = true;
        const btn = document.getElementById('sensorBtn');
        btn.innerText = translations[currentLang].sensorStop;
        btn.style.backgroundColor = "#ef4444";
    }

    function handleMotion(event) {
        let acc = event.accelerationIncludingGravity;
        if (!acc) return;
        let total = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
        let delta = Math.abs(total - lastAccel);
        if (delta > 11) { addSteps(1); }
        lastAccel = total;
    }

    document.getElementById('langSelect').value = currentLang;
    applyTheme();
    changeLanguage(currentLang);
    updateUI();
</script>

</body>
</html>
